services:
  # Local development/prod-like compose only.
  # Do not commit real config/api_keys.local.env. GitLab/server deployment should
  # pass SANDBOX_API_KEY and other secrets through environment variables.
  postgres_local:
    image: postgres:16
    env_file:
      - ../config/api_keys.local.env
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-moex_agent} -d $${POSTGRES_DB:-moex_agent}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis_local:
    image: redis:7.2-alpine
    profiles: ["redis"]
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migration_runner:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../config/api_keys.local.env
    depends_on:
      postgres_local:
        condition: service_healthy
    command: ["python", "-m", "agent_app.storage.postgres.apply_migrations"]
    restart: "no"

  scheduler_worker:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../config/api_keys.local.env
    depends_on:
      postgres_local:
        condition: service_healthy
      migration_runner:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        RUNTIME_ENV_FILE="$${RUNTIME_ENV_FILE:-/tmp/holymoex_runtime/arena_go.env}"
        python -m agent_app.server_startup --runtime-env-file "$$RUNTIME_ENV_FILE"
        . "$$RUNTIME_ENV_FILE"
        exec python -m agent_app.scheduler --interval-seconds "$${SCHEDULER_INTERVAL_SECONDS:-60}"
    restart: unless-stopped
    stop_grace_period: 30s

  staging_runner:
    profiles: ["staging"]
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../config/api_keys.local.env
    depends_on:
      postgres_local:
        condition: service_healthy
      migration_runner:
        condition: service_completed_successfully
    command: ["python", "-m", "agent_app.staging_runner", "--instrument-cap", "2", "--max-news-items", "2"]
    restart: "no"

  agent_app:
    profiles: ["manual"]
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../config/api_keys.local.env
    depends_on:
      postgres_local:
        condition: service_healthy
      migration_runner:
        condition: service_completed_successfully
    command: ["python", "-m", "agent_app.main", "--use-postgres"]
    restart: "no"

  research_worker:
    profiles: ["research"]
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../config/api_keys.local.env
    depends_on:
      postgres_local:
        condition: service_healthy
      migration_runner:
        condition: service_completed_successfully
    command: ["python", "-m", "agent_app.research"]
    restart: "no"

volumes:
  postgres_prod_data:
  redis_prod_data:
