services:
  # Local development compose only.
  # Copy config/api_keys.example.env to config/api_keys.local.env locally and
  # never commit real keys. GitLab/server deployment uses the root Dockerfile
  # plus environment variables, especially SANDBOX_API_KEY.
  postgres_local:
    image: postgres:16
    env_file:
      - ../config/api_keys.local.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-moex_agent} -d $${POSTGRES_DB:-moex_agent}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis_local:
    image: redis:7
    profiles: ["redis"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migration_runner:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../config/api_keys.local.env
    depends_on:
      postgres_local:
        condition: service_healthy
    command: ["python", "-m", "agent_app.storage.postgres.apply_migrations"]
    restart: "no"

  # Optional one-shot control/smoke entrypoint. The autonomous runtime is
  # scheduler_worker; do not run this service with an automatic restart loop.
  agent_app:
    profiles: ["manual"]
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../config/api_keys.local.env
    depends_on:
      postgres_local:
        condition: service_healthy
      migration_runner:
        condition: service_completed_successfully
    volumes:
      - ../data:/app/data
    command: ["python", "-m", "agent_app.main", "--use-postgres"]
    restart: "no"

  scheduler_worker:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../config/api_keys.local.env
    depends_on:
      postgres_local:
        condition: service_healthy
      migration_runner:
        condition: service_completed_successfully
    command: ["python", "-m", "agent_app.scheduler", "--interval-seconds", "60"]
    restart: unless-stopped

  # Optional batch research worker. Enable explicitly with --profile research.
  research_worker:
    profiles: ["research"]
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../config/api_keys.local.env
    depends_on:
      postgres_local:
        condition: service_healthy
      migration_runner:
        condition: service_completed_successfully
    command: ["python", "-m", "agent_app.research"]
    restart: "no"

volumes:
  postgres_local_data:
